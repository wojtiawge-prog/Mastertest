<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Master Plan</title>
<meta name="theme-color" content="#07090d" />
<meta name="description" content="Twój osobisty system: nawyki, trening, dieta, finanse i kalendarz." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Master Plan" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<style>
  html,body{margin:0;background:#07090d;color:#eef2f6;font-family:system-ui,-apple-system,sans-serif;}
  #root{min-height:100vh;}
  #boot{position:fixed;inset:0;display:grid;place-items:center;color:#8b97a7;font-size:14px;letter-spacing:.03em;}
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.119.2"
  }
}
</script>
</head>
<body>
<div id="root"><div id="boot">MASTER PLAN · Ładowanie…</div></div>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import App from "./app.js";
  const boot = document.getElementById("boot"); if (boot) boot.remove();
  createRoot(document.getElementById("root")).render(React.createElement(App));
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
</script>
</body>
</html>
